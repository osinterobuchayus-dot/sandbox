name: Build C++ Project

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libglfw3-dev libvulkan-dev vulkan-tools libxi-dev libxrandr-dev libxinerama-dev libxcursor-dev

    - name: Clone Dear ImGui
      run: |
        git clone --depth 1 https://github.com/ocornut/imgui.git imgui_src
        ls -la imgui_src

    - name: Compile
      run: |
        g++ main.cpp gui.cpp \
            imgui_src/imgui.cpp \
            imgui_src/imgui_draw.cpp \
            imgui_src/imgui_tables.cpp \
            imgui_src/imgui_widgets.cpp \
            imgui_src/backends/imgui_impl_glfw.cpp \
            imgui_src/backends/imgui_impl_vulkan.cpp \
            -Iimgui_src \
            -Iimgui_src/backends \
            -o sandbox.exe \
            -lglfw -lvulkan -ldl -lpthread -lX11 -lXrandr -lXi \
            -static-libgcc -static-libstdc++
            
